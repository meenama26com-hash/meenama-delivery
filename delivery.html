<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9a3412"><title>MeenaMa Delivery Boy</title><style>body{font-family:Arial;margin:0;background:#fff7f1;color:#39251c}.top{background:#9a3412;color:white;padding:22px}main{max-width:800px;margin:auto;padding:14px}.card,.order{background:white;border:1px solid #f0d8c8;border-radius:14px;padding:14px;margin:12px 0}button,select,input{padding:10px;border-radius:8px;border:1px solid #e6c6b4;margin:4px}button{background:#9a3412;color:white;border:0}.muted{color:#876;font-size:13px}</style><header class="top"><h1>MeenaMa Delivery Boy</h1><p>Pending orders · customer address · status</p></header><main><section class="card"><button onclick="load()">Refresh orders</button><div id="orders">Loading…</div></section><section class="card"><h3>Update delivery status</h3><input id="id" placeholder="Order ID"><input id="boy" placeholder="Delivery boy name"><select id="status"><option>Out for delivery</option><option>Delivered</option><option>Delivery attempted</option></select><button onclick="updateStatus()">Update</button><p id="msg" class="muted"></p><p class="muted">Live GPS/map tracking is not included in this starter.</p></section></main><script>async function api(url,opt){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error();return r.json()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let d=await api('/api/orders');let a=(d.orders||d).filter(o=>!['Delivered','Cancelled'].includes(o.status));if(!a.length){orders.textContent='No pending orders';return}orders.innerHTML=a.map(o=>`<div class="order"><b>${esc(o.id)} — ${esc(o.status)}</b><p>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)}</p><p>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</p><b>Total ₹${o.total||0}</b><br><button onclick="id.value='${esc(o.id)}'">Select</button></div>`).join('')}catch(e){orders.textContent='Backend error — check deployment logs.'}}async function updateStatus(){try{await api('/api/orders/'+encodeURIComponent(id.value),{method:'PATCH',body:JSON.stringify({status:status.value,deliveryBoy:boy.value})});msg.textContent='Status updated';load()}catch(e){msg.textContent='Update failed: order/server check karein.'}}load()</script></html>
