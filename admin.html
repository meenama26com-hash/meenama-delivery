<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123a70"><title>MeenaMa Owner/Admin</title><style>body{font-family:Arial;margin:0;background:#f2f5fa;color:#17243b}.top{background:#123a70;color:white;padding:22px}main{max-width:800px;margin:auto;padding:14px}.card,.order{background:white;border:1px solid #dce4ef;border-radius:14px;padding:14px;margin:12px 0}button,select,input{padding:10px;border-radius:8px;border:1px solid #ccd6e4;margin:4px}button{background:#123a70;color:white;border:0} .muted{color:#667;font-size:13px}</style><header class="top"><h1>MeenaMa Owner/Admin</h1><p>Orders · status · billing overview</p></header><main><section class="card"><b>Demo access note</b><p class="muted">Yeh starter dashboard hai, production login/security abhi add karni hogi. Public customer data se pehle secure authentication zaroori hai.</p><button onclick="load()">Refresh orders</button><div id="orders">Loading…</div></section><section class="card"><h3>Order status update</h3><input id="id" placeholder="Order ID"><select id="status"><option>Confirmed</option><option>Packed</option><option>Out for delivery</option><option>Delivered</option><option>Cancelled</option><option>Return requested</option><option>Return approved</option></select><button onclick="updateStatus()">Save status</button><p id="msg" class="muted"></p></section></main><script>async function api(url,opt){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error();return r.json()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let d=await api('/api/orders');let a=d.orders||d;if(!a.length){orders.innerHTML='No orders yet';return}orders.innerHTML=a.map(o=>`<div class="order"><b>${esc(o.id)}</b> — ${esc(o.status)}<p>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)}</p><p>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</p><b>Total: ₹${o.total||0}</b><br><button onclick="id.value='${esc(o.id)}'">Select</button></div>`).join('')}catch(e){orders.textContent='Backend error — check deployment logs.'}}async function updateStatus(){try{await api('/api/orders/'+encodeURIComponent(id.value),{method:'PATCH',body:JSON.stringify({status:status.value})});msg.textContent='Status updated';load()}catch(e){msg.textContent='Update failed: order/server check karein.'}}load()</script></html>
