services:
  - type: web
    name: meenama-delivery-preview
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
disks:
  - name: meenama-data
    mountPath: /var/data
    sizeGB: 1
